<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standard Islami Bank PLC - Digibanking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="splash-screen">
        <!-- আপনার মূল ব্যাকগ্রাউন্ড ছবিটি এখানে বসবে -->
        <!-- নোট: আপনার লাল-নীল দাগ ছাড়া পরিষ্কার ব্যাকগ্রাউন্ড ছবিটি ফোল্ডারে 'bg.jpg' নামে রাখুন -->
        
        <div class="logo-container">
            <div class="bank-title">
                <!-- ব্যাংকের লোগো আইকন (SVG) -->
                <svg class="bank-icon" viewBox="0 0 100 100" width="38" height="38">
                    <polygon points="50,5 95,50 50,95 5,50" fill="#0b6623"/>
                    <polygon points="50,20 80,50 50,80 20,50" fill="#a4d65e"/>
                    <text x="50" y="62" font-size="38" font-weight="bold" fill="#b22222" text-anchor="middle" font-family="Arial">S</text>
                </svg>
                <span>Standard Islami Bank PLC.</span>
            </div>

            <!-- নিচে থেকে উপরে উঠে আসার বক্স -->
            <div class="digibanking-box" id="digiBox">
                <div class="yellow-corner"></div>
                <span class="digi-white">digi</span><span class="digi-outline">banking</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
